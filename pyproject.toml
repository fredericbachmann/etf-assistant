[project]
name = "etf-assistant"
version = "0.1.0"
description = "RAG chatbot that answers questions about ETFs from their KIDs and factsheets, with an evaluation pipeline."
readme = "README.md"
authors = [{ name = "Frederic Bachmann" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14",    # data schemas (FundFacts) + validation
    "pymupdf>=2.1",      # read PDF text page by page
    "pymupdf4llm>=2.1",  # PDF -> Markdown for chunking
    "fastembed>=0.9.1",  # local embedding models (ONNX, no PyTorch)
    "opensearch-py>=3.2.0",  # OpenSearch client
    "pyyaml>=6.0",       # golden test set is YAML
    "anthropic>=2.8.0",
    "gradio>=6.32.0",
    "fastapi>=0.163.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
# `uv run <name>` calls these functions
# data setup
build-catalog = "etf_assistant.corpus.catalog:main"
ingest = "etf_assistant.pipeline:ingest_cli"
index = "etf_assistant.pipeline:index_cli"
search = "etf_assistant.retrieval.store:search_cli"
# the assistant
ask = "etf_assistant.agent.cli:ask_cli"
chat = "etf_assistant.agent.cli:chat_cli"
web = "etf_assistant.web.app:main"
# evaluation
check-facts = "etf_assistant.evals.check_facts:cli"
check-golden = "etf_assistant.evals.check_golden:main"
check-chunks = "etf_assistant.evals.check_chunks:main"
eval-retrieval = "etf_assistant.evals.eval_retrieval:main"
eval-e2e = "etf_assistant.evals.eval_e2e:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
