# Every push to main goes live: tests, then deploy/deploy.sh (build images, update the server).
# To roll back, run this workflow by hand ("Run workflow") with an earlier commit of main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to deploy (empty = the newest on main)
        required: false

concurrency: deploy # one at a time; a second one waits

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm # the server is ARM: build its images natively
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: aws-actions/configure-aws-credentials@v6
        with: # the key of the etf-assistant-github-deploy user (deploy/aws/stack.yaml)
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
      - run: deploy/deploy.sh
