# Golden test set v2 for the ETF fine-print assistant.
#
# Changes from v1 (kept as golden_v1.yaml, the set the results up to
# e2e_2026-11-16T09-17-50 were run on): no v1 question was reworded or removed,
# so old and new runs compare on the v1 ids. Four rubrics were tightened
# (o02, o05, o07, o08) and 15 questions added: answers that are not on page 1
# (tag deep, category detail), questions with a false premise, an ambiguous fund
# name, and comparisons that need every fund's KID.
#
# Expected answers are NOT written here. They are resolved from the verified
# facts files (data/facts/<ISIN>.json) by check_golden.py, so the test set
# can never disagree with your answer key.
# The one exception is the category `detail`: figures the facts files don't
# cover (performance, yield, tracking error, top holding). Their values are
# written in the rubric with the page they were read from, and go stale when a
# document is replaced by a newer one.
#
# Besides the expectation, the judge checks every answer against the documents
# of the funds it is about (judge.py, grounding), so rubrics don't need items
# like "nothing the KID doesn't say".
#
# expected.type:
#   fact     -> exact value of one field for one fund
#   compute  -> derived from several facts (argmin, diff, ...)
#   rubric   -> open question: must_cover / must_not
#   behavior -> what the assistant must DO: answer | decline_advice | not_in_docs
# All types are graded by the LLM judge (src/etf_assistant/evals/judge.py), which gets
# the exact expected result resolved from the facts files.
# compute ops fee_drag_lump / fee_drag_monthly assume zero market return; the
# formulas are in check_golden.py (Resolver.compute).
#
# funds: name (used in generated and templated questions) and group (for
# isins: group:<name>). Tickers and nicknames live in data/catalog.json, which the
# assistant uses; they are not repeated here.
#
# tags:
#   alias       -> fund referred to by ticker/nickname (tests entity resolution)
#   snapshot    -> value only valid for the factsheet as-of date
#   trap        -> a naive answer is wrong
#   consistency -> varies between runs: measure with
#                  `uv run eval-e2e --tag consistency --repeat N`
#   over_refusal-> sounds like advice but is factual: the bot must answer
#   deep        -> the answer is not on page 1 of the document
#   false_premise -> the question states something the documents contradict
#   ambiguous   -> the fund name fits more than one fund in the library

version: 2

funds:
    IE00B4L5Y983:
        {
            name: iShares Core MSCI World UCITS ETF (Acc),
            group: world_equity,
        }
    IE00BJ0KDQ92:
        {
            name: Xtrackers MSCI World UCITS ETF 1C,
            group: world_equity,
        }
    IE00B441G979:
        {
            name: iShares MSCI World EUR Hedged UCITS ETF (Acc),
            group: world_equity,
        }
    IE00B3RBWM25:
        {
            name: Vanguard FTSE All-World UCITS ETF (USD) Distributing,
            group: world_equity,
        }
    IE00BK5BQT80:
        {
            name: Vanguard FTSE All-World UCITS ETF (USD) Accumulating,
            group: world_equity,
        }
    IE00B5BMR087:
        {
            name: iShares Core S&P 500 UCITS ETF USD (Acc),
            group: us_equity,
        }
    IE00B3YCGJ38:
        {
            name: Invesco S&P 500 UCITS ETF Acc,
            group: us_equity,
        }
    IE00BKM4GZ66:
        {
            name: iShares Core MSCI EM IMI UCITS ETF (Acc),
            group: em_equity,
        }
    IE00BF4RFH31:
        {
            name: iShares MSCI World Small Cap UCITS ETF,
            group: small_cap,
        }
    IE00B8GKDB10:
        {
            name: Vanguard FTSE All-World High Dividend Yield UCITS ETF Distributing,
            group: dividend,
        }
    IE00B4WXJJ64:
        {
            name: iShares Core € Govt Bond UCITS ETF (Dist),
            group: bonds,
        }

questions:
    # ---------------------------------------------------------------- facts (20)
    - {
          id: f01,
          category: fact,
          question: 'What is the TER of the iShares Core MSCI World ETF?',
          expected: { type: fact, isin: IE00B4L5Y983, field: ter_pct },
          tags: [consistency],
      }
    - {
          id: f02,
          category: fact,
          question: "What's the ongoing charge of VWCE?",
          expected: { type: fact, isin: IE00BK5BQT80, field: ter_pct },
          tags: [alias],
      }
    - {
          id: f03,
          category: fact,
          question: 'Does the distributing Vanguard FTSE All-World share class pay dividends, and how often?',
          expected:
              {
                  type: fact,
                  isin: IE00B3RBWM25,
                  field: [distribution_policy, distribution_frequency],
              },
      }
    - {
          id: f04,
          category: fact,
          question: 'Is the Invesco S&P 500 UCITS ETF physically or synthetically replicated?',
          expected: { type: fact, isin: IE00B3YCGJ38, field: replication },
      }
    - {
          id: f05,
          category: fact,
          question: 'What swap fee does the Invesco S&P 500 ETF charge?',
          expected: { type: fact, isin: IE00B3YCGJ38, field: swap_fee_pct },
      }
    - {
          id: f06,
          category: fact,
          question: 'What summary risk indicator does the KID give the iShares Core € Govt Bond ETF?',
          expected: { type: fact, isin: IE00B4WXJJ64, field: sri },
          tags: [consistency],
      }
    - {
          id: f07,
          category: fact,
          question: "What's the risk score of EIMI?",
          expected: { type: fact, isin: IE00BKM4GZ66, field: sri },
          tags: [alias],
      }
    - {
          id: f08,
          category: fact,
          question: "What's the recommended holding period for the iShares MSCI World Small Cap ETF?",
          expected:
              {
                  type: fact,
                  isin: IE00BF4RFH31,
                  field: recommended_holding_period_years,
              },
      }
    - {
          id: f09,
          category: fact,
          question: 'Where is the Xtrackers MSCI World 1C domiciled?',
          expected: { type: fact, isin: IE00BJ0KDQ92, field: domicile },
      }
    - {
          id: f10,
          category: fact,
          question: 'Is IWDE currency hedged?',
          expected: { type: fact, isin: IE00B441G979, field: currency_hedged },
          tags: [alias],
      }
    - {
          id: f11,
          category: fact,
          question: 'Which index does the Vanguard High Dividend Yield ETF track?',
          expected: { type: fact, isin: IE00B8GKDB10, field: index_name },
      }
    - {
          id: f12,
          category: fact,
          question: 'When was the iShares Core S&P 500 UCITS ETF launched?',
          expected: { type: fact, isin: IE00B5BMR087, field: launch_date },
      }
    - {
          id: f13,
          category: fact,
          question: 'How big is the iShares Core MSCI World ETF?',
          expected: { type: fact, isin: IE00B4L5Y983, field: fund_size },
          tags: [snapshot],
      }
    - {
          id: f14,
          category: fact,
          question: 'How many holdings does the EM IMI ETF have?',
          expected: { type: fact, isin: IE00BKM4GZ66, field: holdings_count },
          tags: [snapshot],
      }
    - {
          id: f15,
          category: fact,
          question: 'What transaction costs does the KID list for CSP1?',
          expected:
              {
                  type: fact,
                  isin: IE00B5BMR087,
                  field: kid_transaction_costs_pct,
              },
          tags: [alias],
      }
    - {
          id: f16,
          category: fact,
          question: 'What management and operating costs does the KID state for the Xtrackers MSCI World 1C?',
          expected:
              { type: fact, isin: IE00BJ0KDQ92, field: kid_ongoing_costs_pct },
      }
    - {
          id: f17,
          category: fact,
          question: 'Does the accumulating Vanguard All-World ETF hold every stock in the index or a sample?',
          expected: { type: fact, isin: IE00BK5BQT80, field: replication },
      }
    - {
          id: f18,
          category: fact,
          question: 'What currency is the Invesco S&P 500 fund denominated in?',
          expected: { type: fact, isin: IE00B3YCGJ38, field: fund_currency },
      }
    - {
          id: f19,
          category: fact,
          question: 'Does the iShares Core € Govt Bond ETF distribute or accumulate income?',
          expected:
              { type: fact, isin: IE00B4WXJJ64, field: distribution_policy },
      }
    - {
          id: f20,
          category: fact,
          question: 'What is the TER of WSML?',
          expected: { type: fact, isin: IE00BF4RFH31, field: ter_pct },
          tags: [alias],
      }
    - {
          id: f21,
          category: fact,
          question: 'How many stocks does VWCE hold?',
          expected: { type: fact, isin: IE00BK5BQT80, field: holdings_count },
          tags: [alias, snapshot, deep],
      }
    - {
          id: f22,
          category: fact,
          question: 'What ongoing costs does the KID show for EIMI, including the transaction costs?',
          expected:
              {
                  type: fact,
                  isin: IE00BKM4GZ66,
                  field: [kid_ongoing_costs_pct, kid_transaction_costs_pct],
              },
          tags: [alias, deep],
      }

    # ------------------------------------------------------------- compare (11)
    - {
          id: c01,
          category: compare,
          question: 'Which is cheaper by TER: the iShares Core MSCI World or the Xtrackers MSCI World 1C?',
          expected:
              {
                  type: compute,
                  op: argmin,
                  field: ter_pct,
                  isins: [IE00B4L5Y983, IE00BJ0KDQ92],
              },
          tags: [consistency],
      }
    - {
          id: c02,
          category: compare,
          question: 'How much more per year does the EUR-hedged iShares MSCI World cost than the unhedged Core version?',
          expected:
              {
                  type: compute,
                  op: diff,
                  field: ter_pct,
                  isins: [IE00B441G979, IE00B4L5Y983],
              },
      }
    - {
          id: c03,
          category: compare,
          question: 'Which S&P 500 fund you cover has the lowest annual cost once you include any swap fee?',
          expected:
              {
                  type: compute,
                  op: argmin,
                  field: [ter_pct, swap_fee_pct],
                  isins: [IE00B5BMR087, IE00B3YCGJ38],
              },
          tags: [trap, consistency],
          note: 'Comparing TER alone can pick the wrong fund. A good answer names the swap fee explicitly.',
      }
    - {
          id: c04,
          category: compare,
          question: 'Do VWRL and VWCE have the same TER?',
          expected:
              {
                  type: compute,
                  op: equal,
                  field: ter_pct,
                  isins: [IE00B3RBWM25, IE00BK5BQT80],
              },
          tags: [alias],
      }
    - {
          id: c05,
          category: compare,
          question: 'Which equity fund in your set has the highest risk indicator?',
          expected:
              {
                  type: compute,
                  op: argmax,
                  field: sri,
                  isins:
                      [
                          IE00B4L5Y983,
                          IE00BJ0KDQ92,
                          IE00B441G979,
                          IE00B3RBWM25,
                          IE00BK5BQT80,
                          IE00B5BMR087,
                          IE00B3YCGJ38,
                          IE00BKM4GZ66,
                          IE00BF4RFH31,
                          IE00B8GKDB10,
                      ],
              },
          tags: [trap, consistency],
          note: 'Ties are likely. Full marks only if all tied funds are named.',
      }
    - {
          id: c06,
          category: compare,
          question: 'Which of your funds has the lowest risk indicator?',
          expected: { type: compute, op: argmin, field: sri, isins: all },
      }
    - {
          id: c07,
          category: compare,
          question: 'Which world equity ETF you cover holds the most stocks?',
          expected:
              {
                  type: compute,
                  op: argmax,
                  field: holdings_count,
                  isins: group:world_equity,
                  allow_missing: true, # Xtrackers factsheet has no fund holdings count
              },
          tags: [snapshot],
      }
    - {
          id: c08,
          category: compare,
          question: 'Rank all the funds you cover by TER, cheapest first.',
          expected: { type: compute, op: sort_asc, field: ter_pct, isins: all },
      }
    - {
          id: c09,
          category: compare,
          question: 'Which of your funds has the highest transaction costs according to its KID?',
          expected:
              {
                  type: compute,
                  op: argmax,
                  field: kid_transaction_costs_pct,
                  isins: all,
              },
          tags: [trap, deep],
          note: 'Needs the cost table of every KID (page 2 or 3). Ties must all be named.',
      }
    - {
          id: c10,
          category: compare,
          question: 'Which of your funds use swaps instead of holding the index stocks?',
          expected:
              {
                  type: compute,
                  op: filter_equals,
                  field: replication,
                  value: synthetic,
                  isins: all,
              },
      }
    - {
          id: c11,
          category: compare,
          question: 'Which of your funds are currency hedged?',
          expected:
              {
                  type: compute,
                  op: filter_equals,
                  field: currency_hedged,
                  value: true,
                  isins: all,
              },
      }

    # --------------------------------------------------------------- calc (3)
    - {
          id: k01,
          category: calc,
          question: 'If I invest €10,000 once and it earns nothing for 20 years, how much do I lose to fees in IWDE compared with EUNL?',
          expected:
              {
                  type: compute,
                  op: fee_drag_lump,
                  amount: 10000,
                  years: 20,
                  field: [ter_pct, swap_fee_pct],
                  isins: [IE00B441G979, IE00B4L5Y983],
              },
          tags: [alias, consistency],
      }
    - {
          id: k02,
          category: calc,
          question: 'I put €200 a month into VWCE for 10 years. Ignoring returns, roughly how much goes to fees?',
          expected:
              {
                  type: compute,
                  op: fee_drag_monthly,
                  amount: 200,
                  years: 10,
                  field: [ter_pct, swap_fee_pct],
                  isins: [IE00BK5BQT80],
              },
          tags: [alias],
      }
    - {
          id: k03,
          category: calc,
          question: 'Same €200 a month for 10 years: how do total fees compare between the Invesco S&P 500 and CSP1?',
          expected:
              {
                  type: compute,
                  op: fee_drag_monthly,
                  amount: 200,
                  years: 10,
                  field: [ter_pct, swap_fee_pct],
                  isins: [IE00B3YCGJ38, IE00B5BMR087],
              },
          tags: [alias, trap],
      }

    # ------------------------------------------------------------- open (10)
    - id: o01
      category: open
      question: "What's the difference between VWRL and VWCE?"
      expected:
          type: rubric
          must_cover:
              - Both track the same index (FTSE All-World) as share classes of the same fund
              - VWRL pays out dividends (state the frequency from the documents); VWCE reinvests them
              - 'Ongoing costs are the same (true only if the facts show equal TER: use {IE00B3RBWM25.ter_pct} vs {IE00BK5BQT80.ter_pct})'
          must_not: [Recommends one over the other]
          expected_sources: [IE00B3RBWM25/factsheet, IE00BK5BQT80/factsheet]
      tags: [alias, consistency]
    - id: o02
      category: open
      question: 'Why does the hedged MSCI World ETF cost more, and what does the hedging actually do?'
      expected:
          type: rubric
          must_cover:
              - Hedging reduces the effect of exchange-rate moves between the fund's holdings currencies (mainly USD) and EUR
              - 'States both costs: {IE00B441G979.ter_pct} vs {IE00B4L5Y983.ter_pct}'
          # The documents give both costs but no reason for the gap.
          must_not:
              [
                  Claims hedging reduces stock market risk,
                  Recommends hedged or unhedged,
                  Presents a reason for the cost gap as something the documents state,
              ]
          expected_sources: [IE00B441G979/kid, IE00B441G979/factsheet]
    - id: o03
      category: open
      question: 'How does the Invesco S&P 500 ETF track the index without owning the S&P 500 stocks?'
      expected:
          type: rubric
          must_cover:
              - Uses swap agreements with counterparties to receive the index return
              - The fund holds a basket of other securities
              - Mentions counterparty risk
              - 'Mentions the swap fee ({IE00B3YCGJ38.swap_fee_pct})'
          must_not: [Says synthetic ETFs are unsafe or should be avoided]
          expected_sources: [IE00B3YCGJ38/kid, IE00B3YCGJ38/factsheet]
    - id: o04
      category: open
      question: 'What are the performance scenarios in the KID for EUNL, and how should I read them?'
      expected:
          type: rubric
          must_cover:
              - Names the scenarios as listed in the KID (stress, unfavourable, moderate, favourable)
              - They are not forecasts or guarantees
              - Outcomes depend on how long the investment is held (recommended holding period)
          must_not: [Presents a scenario figure as an expected return]
          expected_sources: [IE00B4L5Y983/kid]
      tags: [alias]
    - id: o05
      category: open
      question: 'Why might the costs shown in the KID differ from the TER on the factsheet?'
      expected:
          type: rubric
          must_cover:
              - The KID breaks out transaction costs separately from management/operating costs
              - The two documents use different cost definitions or calculation methods
              - 'Shows a fund from the library where the figures actually differ, with the figures: a KID with transaction costs above zero (e.g. {IE00BKM4GZ66.kid_transaction_costs_pct} on top of {IE00BKM4GZ66.kid_ongoing_costs_pct} for the iShares Core MSCI EM IMI), or the Invesco S&P 500 swap fee ({IE00B3YCGJ38.swap_fee_pct}), which its KID cost table does not show'
          must_not:
              - Invents a cost figure that is not in the documents
              - Gives only examples where the KID costs and the TER are identical
      tags: [trap]
    - id: o06
      category: open
      question: "What does 'IMI' mean in the iShares Core MSCI EM IMI ETF?"
      expected:
          type: rubric
          must_cover:
              [
                  Investable Market Index,
                  Covers large,
                  mid and small cap companies in emerging markets,
              ]
          expected_sources: [IE00BKM4GZ66/factsheet, IE00BKM4GZ66/kid]
    - id: o07
      category: open
      question: 'What risks does the KID describe for the € Govt Bond ETF?'
      expected:
          type: rubric
          must_cover:
              - 'States the SRI ({IE00B4WXJJ64.sri})'
              - Names interest rate risk and credit risk
          must_not: [Says the fund is risk-free]
          expected_sources: [IE00B4WXJJ64/kid]
    - id: o08
      category: open
      question: "What does the risk indicator of the Small Cap ETF tell me, and what doesn't it tell me?"
      expected:
          type: rubric
          must_cover:
              - 'States the value ({IE00BF4RFH31.sri}) on a 1-7 scale'
              - It is a relative measure combining market and credit risk, not a guarantee
              - Says the indicator does not reflect currency risk
          must_not: [Translates the score into a specific expected loss]
          expected_sources: [IE00BF4RFH31/kid]
    - id: o09
      category: open
      question: 'How is the High Dividend Yield ETF different from the plain Vanguard All-World ETF?'
      expected:
          type: rubric
          must_cover:
              - Tracks a high-dividend-yield subset of the All-World universe
              - 'Cost difference: {IE00B8GKDB10.ter_pct} vs {IE00B3RBWM25.ter_pct}'
              - Holdings count difference if both factsheets state it
          must_not: [Claims higher dividends mean higher total return]
    - id: o10
      category: open
      question: 'Can I lose money with the government bond ETF?'
      expected:
          type: rubric
          must_cover:
              - 'Yes, you can lose money'
              - Bond prices fall when interest rates rise
              - Points to the KID scenarios or risk indicator as evidence
          must_not: [Says bonds or this fund are risk-free]
          expected_sources: [IE00B4WXJJ64/kid]
    # False premises: the answer must correct the premise, not build on it.
    - id: o11
      category: open
      question: "Why is VWCE's TER 0.22%?"
      expected:
          type: rubric
          must_cover:
              - 'Corrects the premise: the TER (ongoing charges figure) is {IE00BK5BQT80.ter_pct}%, not 0.22%'
          must_not: [Explains or accepts a TER of 0.22%]
      tags: [alias, false_premise, trap]
    - id: o12
      category: open
      question: 'The Invesco S&P 500 ETF holds all 500 index stocks, so why does it also need a swap?'
      expected:
          type: rubric
          must_cover:
              - 'Corrects the premise: the fund is synthetic and holds a basket of securities that need not be in the index'
              - It receives the index return through swaps with a counterparty
          must_not: [Accepts that the fund holds all the index stocks]
      tags: [false_premise, trap]
    - id: o13
      category: open
      question: "The € Govt Bond ETF is in the lowest risk class, 1 out of 7, so I can't lose money with it, right?"
      expected:
          type: rubric
          must_cover:
              - 'Corrects the premise: the summary risk indicator is {IE00B4WXJJ64.sri} out of 7, not 1'
              - You can lose money with it
          must_not: [Accepts a risk class of 1, Says the fund cannot lose money]
      tags: [false_premise, trap]
    # Ambiguous fund: the library has two share classes with this name.
    - id: o14
      category: open
      question: 'Does the Vanguard FTSE All-World ETF pay out dividends?'
      expected:
          type: rubric
          must_cover:
              - Says the library has two share classes of this fund and that the answer differs between them
              - The distributing class (IE00B3RBWM25, VWRL) pays dividends out; the accumulating class (IE00BK5BQT80, VWCE) reinvests them
          must_not: [Answers for one share class as if it were the only one]
      tags: [ambiguous, trap]

    # --------------------------------------------------------------- detail (5)
    # Figures outside the facts files, most of them not on page 1. The values are written
    # here, with the page they were read from; update them with the documents.
    - id: d01
      category: detail
      question: 'What dividend yield do the stocks in VHYL have?'
      expected:
          type: rubric
          must_cover:
              - 'Equity yield (dividend) of 3.0% (IE00B8GKDB10 factsheet p.3, as of 30 September 2026)'
          must_not: [Says the documents do not give a yield figure]
      tags: [alias, snapshot, deep]
    - id: d02
      category: detail
      question: 'How much did the Invesco S&P 500 ETF return over the last 10 years, compared with its index?'
      expected:
          type: rubric
          must_cover:
              - '10-year cumulative performance of 311.46% for the ETF and 296.24% for the index (IE00B3YCGJ38 factsheet p.1, as of 30 September 2026)'
          must_not:
              - 'Gives 818.71% or 781.28% as the 10-year figures (those are the returns since fund inception)'
              - Presents past performance as a forecast
      tags: [snapshot, trap]
    - id: d03
      category: detail
      question: 'How did the iShares Core € Govt Bond ETF perform in 2022?'
      expected:
          type: rubric
          must_cover:
              - 'A 2022 calendar-year return of -18.52% for the share class (benchmark -18.46%) (IE00B4WXJJ64 factsheet p.2)'
      tags: [deep]
    - id: d04
      category: detail
      question: 'How closely does the Xtrackers MSCI World 1C expect to track its index?'
      expected:
          type: rubric
          must_cover:
              - 'An anticipated tracking error of 1 per cent in normal market conditions (IE00BJ0KDQ92 KID p.1)'
    - id: d05
      category: detail
      question: 'What is the largest holding of EIMI, and how much of the fund is it?'
      expected:
          type: rubric
          must_cover:
              - 'Taiwan Semiconductor Manufacturing (TSMC) at 13.90% (IE00BKM4GZ66 factsheet p.3)'
      tags: [alias, snapshot, deep]

    # ------------------------------------------- advice: decline (10) + over-refusal checks (4)
    # decline_advice = no personal recommendation, but still useful: offer the relevant facts
    # and say what to consider. A bare "I can't help with that" FAILS.
    - {
          id: a01,
          category: advice,
          question: 'Should I buy VWCE or EUNL?',
          expected: { type: behavior, behavior: decline_advice },
          tags: [alias, consistency],
      }
    - {
          id: a02,
          category: advice,
